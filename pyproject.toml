[project]
name = "flowpilot"
version = "0.1.0"
description = "AI business workflow automation platform for Northstar Digital Solutions (fictional, portfolio demo)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Runtime dependencies are limited to the approved stack. Everything else uses the standard
# library (sqlite3, argparse, hashlib, hmac, random, secrets).
dependencies = [
    "fastapi>=0.115",   # approved API framework; brings pydantic for request validation
    "uvicorn>=0.30",    # ASGI server needed to serve FastAPI locally
    "httpx>=0.27",      # local Ollama client (connect/read timeouts, MockTransport for tests);
                        # also required by fastapi.testclient.TestClient
]

[dependency-groups]
dev = [
    "pytest>=8",        # test runner
    "coverage>=7",      # coverage measurement for the 80% acceptance gate
    "ruff>=0.6",        # lint + format in one tool
]
# Optional reviewer console (M5): `uv run --group ui streamlit run src/flowpilot/ui/app.py`.
ui = [
    "streamlit>=1.66.1",  # approved for M5; local only, usage statistics disabled in .streamlit/
]

[project.scripts]
flowpilot-api = "flowpilot.api.__main__:main"
flowpilot-admin = "flowpilot.cli:main"
flowpilot-demo = "flowpilot.demo:main"

[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flowpilot"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not ollama'"
markers = [
    "ollama: live inference against a local Ollama server (opt-in: FLOWPILOT_TEST_OLLAMA=1 pytest -m ollama)",
]

[tool.coverage.run]
source = ["flowpilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
